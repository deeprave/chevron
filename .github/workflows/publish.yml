name: Publish

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub release as a pre-release
        required: false
        type: boolean
        default: false

jobs:
  verify-ci:
    name: Verify CI for release commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Record release commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read package version
        id: version
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&status=completed&per_page=100" --jq '[.workflow_runs[] | select(.event == "push" and .conclusion == "success")] | first.id // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "No successful push-triggered CI run exists for ${RELEASE_SHA}."
            exit 1
          fi

          JOBS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
          for JOB in "Test Python 3.11" "Test Python 3.12" "Test Python 3.13" "Test Python 3.14" "Test Python 3.15" "Quality checks"; do
            if ! jq -e --arg job "$JOB" '[.jobs[] | select(.name == $job and .conclusion == "success")] | length > 0' <<<"$JOBS" >/dev/null; then
              echo "Required CI job did not succeed: $JOB"
              exit 1
            fi
          done

      - name: Require an unreleased version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Version ${VERSION} already has a GitHub release."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
            exit 1
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: verify-ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-ci.outputs.commit_sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  create-release:
    name: Create GitHub release
    needs: [verify-ci, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-ci.outputs.commit_sha }}

      - name: Extract release notes
        env:
          VERSION: ${{ needs.verify-ci.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '$0 == "## [" version "]" { found=1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > release-notes.md

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_SHA: ${{ needs.verify-ci.outputs.commit_sha }}
          VERSION: ${{ needs.verify-ci.outputs.version }}
        run: |
          set -euo pipefail
          ARGS=("v${VERSION}" --target "$RELEASE_SHA" --title "Release v${VERSION}")
          if [ -s release-notes.md ]; then
            ARGS+=(--notes-file release-notes.md)
          else
            ARGS+=(--generate-notes)
          fi
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--latest)
          fi
          gh release create "${ARGS[@]}"
