name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: uv sync --frozen --dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest -Werror -m 'not mustache_inheritance'
        env:
          NO_COLOR: "1"
          TERM: dumb

  async-compatibility:
    name: Async compatibility (Python ${{ matrix.python-version }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            backend: asyncio
            packages: anyio==4.14.0
          - python-version: "3.11"
            backend: trio
            packages: anyio==4.14.0 trio==0.32.0
          - python-version: "3.15"
            backend: asyncio
            packages: anyio==4.14.0
          - python-version: "3.15"
            backend: trio
            packages: anyio==4.14.0 trio==0.32.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install compatibility dependencies
        run: |
          uv sync --frozen --dev --python ${{ matrix.python-version }}
          uv pip uninstall trio
          uv pip install ${{ matrix.packages }}

      - name: Run async compatibility tests
        run: uv run --no-sync pytest tests/async/test_compatibility.py -Werror
        env:
          CHEVRON_ANYIO_BACKEND: ${{ matrix.backend }}
          NO_COLOR: "1"
          TERM: dumb

  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: uv sync --frozen --dev --python 3.11

      - name: Check lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run ty check src tests

      - name: Check source annotations
        run: uv run ruff check src --select ANN,PYI --preview

      - name: Check vulnerabilities
        run: uvx --from osvcheck==1.2.0 osvcheck

      - name: Validate project metadata
        run: uvx --from validate-pyproject==0.25 validate-pyproject pyproject.toml

      - name: Check security findings
        run: uvx --from bandit==1.9.4 bandit -ll -r src/

      - name: Check dead code
        run: uvx --from vulture==2.15 vulture src/

      - name: Build package
        run: uv build
