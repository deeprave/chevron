[build-system]
requires = ["uv_build>=0.12.15,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chevron"

[project]
name = "chevron-ng"
version = "0.17.1"
description = "Mustache templating language renderer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Noah Morrison", email = "noah@morrison.ph" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/deeprave/chevron"
Documentation = "https://deeprave.github.io/chevron/"
Repository = "https://github.com/deeprave/chevron"

[project.scripts]
chevron = "chevron:cli_main"

[project.optional-dependencies]
anyio = [
    "anyio>=4.14.0",
]
trio = [
    "anyio[trio]>=4.14.0",
    "trio>=0.32.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.0",
]

[dependency-groups]
dev = [
    "anyio[trio]>=4.14.0",
    "trio>=0.32.0",
    "hypothesis>=6.170.1",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=chevron",
    "--cov-report=term-missing",
]
markers = [
    "conformance: vendored upstream Mustache specification compatibility tests",
    "mustache_comments: Mustache comments specification module",
    "mustache_delimiters: Mustache delimiters specification module",
    "mustache_dynamic_names: Mustache dynamic names specification module",
    "mustache_inheritance: Mustache inheritance specification module",
    "mustache_interpolation: Mustache interpolation specification module",
    "mustache_inverted: Mustache inverted sections specification module",
    "mustache_lambdas: Mustache lambdas specification module",
    "mustache_partials: Mustache partials specification module",
    "mustache_sections: Mustache sections specification module",
]

[tool.coverage.run]
branch = true
source = ["chevron"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "def cli_main",
    "# python 2",
    "# not tested",
]

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
extra-paths = ["tests"]

[[tool.ty.overrides]]
include = ["src"]

[tool.ty.overrides.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"
