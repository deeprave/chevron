[build-system]
requires = ["uv_build>=0.12.15,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chevron"

[project]
name = "chevron-ng"
version = "0.15.0"
description = "Mustache templating language renderer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Noah Morrison", email = "noah@morrison.ph" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/deeprave/chevron"
Repository = "https://github.com/deeprave/chevron"

[project.scripts]
chevron = "chevron:cli_main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
    "ty",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=chevron",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["chevron"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "def cli_main",
    "# python 2",
    "# not tested",
]

[tool.ruff]
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
